name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  check:
    runs-on: ubuntu-latest
    env:
      RUST_ANYTHING_REQUIRE: node,cargo
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/check-secrets.sh --all
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    runs-on: macos-latest
    env:
      RUST_ANYTHING_REQUIRE: node,python3,go,ruby,java,cc,cargo
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo install --path .
      - name: Install the wasm-bindgen CLI the wasm demo uses
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' demo/fixtures/classes-rs/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Gate every demo port
        run: |
          for crate in demo/fixtures/*-rs; do
            rust-anything gate "$crate"
          done

  windows:
    runs-on: windows-latest
    env:
      RUST_ANYTHING_REQUIRE: node,python,go,ruby,java,cargo
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - name: Test Windows command parsing
        run: cargo test --locked --lib app::tests::shell_words
      - name: Run native bridge integration tests
        run: cargo test --locked --test native -- --nocapture

  # The whole loop on a real port: build both bridges and pass the gate.
  demo:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --path .
      - name: Gate the fixture ports
        run: |
          for crate in demo/fixtures/async-rs; do
            rust-anything gate "$crate"
          done
