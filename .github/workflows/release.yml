name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="rust-anything-$GITHUB_REF_NAME-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/rust-anything"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          mkdir -p "dist/$name" npm-bin
          cp "$bin" README.md LICENSE CHANGELOG.md "dist/$name/"
          cp "$bin" npm-bin/
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.npm }}
          path: npm-bin/*
          if-no-files-found: error

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (on) exit; if (index($0, "## " v " ") == 1) { on = 1; next } } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm-bin
      - name: Publish to npm (trusted publishing)
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir=$(node scripts/npm-packages.mjs "$version" npm-bin npm-out)
          if npm view "rust-anything@$version" version > /dev/null 2>&1; then
            echo "rust-anything@$version is already on npm"
          else
            npm publish "$dir" --access public
          fi

  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io (trusted publishing)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sf -A "rust-anything-release (github.com/erkamyaman/rust-anything)" \
              "https://crates.io/api/v1/crates/rust-anything/$version" > /dev/null; then
            echo "rust-anything $version is already on crates.io"
          else
            cargo publish --locked
          fi
